name: Deploy SportiQue static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# Two jobs on purpose. When the deploy step ran in the same job right after the upload, it often asked for
# the artifact before the artifact list showed it and failed with "No artifacts named github-pages were found".
# The site is deployed only after the build job (build and tests) has passed.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build all public pages
        run: node scripts/build-site.mjs

      - name: Validate landing and retained routes
        run: node --test tests/*.test.mjs

      - name: Stamp deployed revision
        run: printf '%s\n' "$GITHUB_SHA" > DEPLOYED_COMMIT

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
